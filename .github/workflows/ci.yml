# CI is a thin caller of the Taskfile: every step is a `task` a developer can run locally,
# with tools from mise.toml. Nothing here should be a command that exists only in CI.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and validate template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4.3.0
        with:
          cache: true

      - run: task install
      - run: task ci

  # The whole pipeline, for real, with no AWS credentials: deploy into LocalStack, post
  # events at the webhook, and count what the archiver wrote with DuckDB.
  localstack:
    name: End-to-end in LocalStack
    runs-on: ubuntu-latest
    needs: test
    env:
      # LocalStack needs an auth token even on its free tier; this is the one secret CI has.
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4.3.0
        with:
          cache: true

      - run: task install
      - run: task local:e2e
