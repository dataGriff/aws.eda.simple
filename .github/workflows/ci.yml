name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

  # The whole pipeline, for real, with no AWS credentials: terraform apply into LocalStack,
  # post events at the webhook, and check the catch-all rule delivered every one of them.
  localstack:
    name: End-to-end in LocalStack
    runs-on: ubuntu-latest
    needs: test
    env:
      # LocalStack needs an auth token even on its free tier; this is the one secret CI has.
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The wrapper adds output around `terraform output -raw`, which make local-url captures.
          terraform_wrapper: false

      - name: Deploy, generate and verify in LocalStack
        run: make local-e2e
