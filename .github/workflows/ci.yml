name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and validate template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint --region eu-west-1

  # The whole pipeline, for real, with no AWS credentials: deploy into LocalStack, post
  # events at the webhook, and count what the archiver wrote with DuckDB.
  localstack:
    name: End-to-end in LocalStack
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install SAM and samlocal
        run: pip install -r requirements-dev.txt aws-sam-cli aws-sam-cli-local

      - name: Install the DuckDB CLI
        run: |
          curl -sSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip duckdb && sudo mv duckdb /usr/local/bin/ && duckdb --version

      # Same `docker run` a developer uses. LocalStack needs an auth token even on its
      # free tier, so this job requires the LOCALSTACK_AUTH_TOKEN repository secret.
      - name: Start LocalStack
        run: make local-up
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Deploy into LocalStack
        run: make local-deploy

      - name: Generate events
        run: make local-generate

      - name: Wait for the archiver's batching window
        run: sleep 45

      - name: Verify the archive with DuckDB
        run: make local-verify EXPECT=30
