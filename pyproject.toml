[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "generator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["webhook", "generator", "tests"]

[tool.ruff.lint.per-file-ignores]
# asserts and hard-coded test secrets are fine in tests
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
