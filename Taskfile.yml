# Single entry point for developers, AI agents and CI. Tools come from mise.toml.
# `task --list` shows everything; `task ci` is what CI runs; `task local:e2e` is the
# whole pipeline in LocalStack.
version: "3"

vars:
  STACK: aws-eda-simple
  REGION: eu-west-1
  BUS_NAME: simple-eda-bus
  EVENT_SOURCE: com.example.shop
  PY: .venv/bin/python
  QUERY_FILE: queries/examples.sql
  # Extra duckdb CLI flags, e.g. DUCKDB_FLAGS=-dark-mode if your terminal does not
  # answer DuckDB's background-colour probe.
  DUCKDB_FLAGS: ""
  # LocalStack. The webhook secret here is deliberately not secret: it only ever guards
  # a webhook on localhost.
  LOCAL_ENDPOINT: http://localhost:4566
  LOCAL_IMAGE: localstack/localstack
  LOCAL_SECRET: local-dev-secret-0123456789
  LOCAL_ARCHIVE: "s3://{{.STACK}}-lake-000000000000-{{.REGION}}/events/**/*.jsonl.gz"
  EXPECT: 30
  # DuckDB session set-up. One place, so the AWS and LocalStack query tasks cannot drift.
  DUCKDB_BOOT: "INSTALL httpfs; LOAD httpfs;"
  AWS_SECRET_SQL: "CREATE OR REPLACE SECRET (TYPE s3, PROVIDER credential_chain, REGION '{{.REGION}}');"
  LOCAL_SECRET_SQL: "CREATE OR REPLACE SECRET (TYPE s3, KEY_ID 'test', SECRET 'test', REGION '{{.REGION}}', ENDPOINT 'localhost:4566', USE_SSL false, URL_STYLE 'path');"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ------------------------------------------------------------------ develop
  install:
    desc: Create .venv and install dev dependencies
    cmds:
      - python -m venv .venv
      - "{{.PY}} -m pip install --quiet --upgrade pip"
      - "{{.PY}} -m pip install --quiet -r requirements-dev.txt"

  lint:
    desc: Run ruff lint + format check
    cmds:
      - "{{.PY}} -m ruff check ."
      - "{{.PY}} -m ruff format --check ."

  fmt:
    desc: Auto-fix lint and format
    cmds:
      - "{{.PY}} -m ruff check --fix ."
      - "{{.PY}} -m ruff format ."

  test:
    desc: Run unit tests (no AWS needed)
    cmds:
      - "{{.PY}} -m pytest"

  validate:
    desc: Validate the SAM template
    cmds:
      - sam validate --lint --region {{.REGION}}

  ci:
    desc: What CI runs first - lint, tests, template validation
    cmds:
      - task: lint
      - task: test
      - task: validate

  build:
    desc: Build the SAM application
    cmds:
      - sam build

  # ------------------------------------------------------------------ AWS
  deploy:
    desc: Deploy the stack to AWS (requires WEBHOOK_SECRET in the environment)
    deps: [build]
    preconditions:
      - sh: test -n "$WEBHOOK_SECRET"
        msg: 'WEBHOOK_SECRET is not set. Try: export WEBHOOK_SECRET=$(openssl rand -hex 24)'
    cmds:
      - >-
        sam deploy --stack-name {{.STACK}} --region {{.REGION}}
        --parameter-overrides WebhookSecret=$WEBHOOK_SECRET BusName={{.BUS_NAME}} EventSource={{.EVENT_SOURCE}}

  deploy:guided:
    desc: Interactive first-time deploy
    deps: [build]
    cmds:
      - sam deploy --guided --stack-name {{.STACK}} --region {{.REGION}}

  outputs:
    desc: Show stack outputs
    cmds:
      - aws cloudformation describe-stacks --stack-name {{.STACK}} --region {{.REGION}} --query 'Stacks[0].Outputs' --output table

  url:
    desc: Print the webhook URL
    cmds:
      - task: _output
        vars: { KEY: WebhookUrl, ENDPOINT_ARGS: "" }

  bucket:
    desc: Print the lake bucket name
    cmds:
      - task: _output
        vars: { KEY: LakeBucketName, ENDPOINT_ARGS: "" }

  generate:
    desc: Post fake events to the deployed webhook (requires WEBHOOK_SECRET)
    preconditions:
      - sh: test -n "$WEBHOOK_SECRET"
        msg: WEBHOOK_SECRET is not set
    vars:
      URL:
        sh: task url
    cmds:
      - WEBHOOK_URL={{.URL}} {{.PY}} generator/generate.py --interval 2 --batch-size 3 --count 10

  logs:
    desc: Tail the webhook Lambda logs
    cmds:
      - sam logs -n WebhookFunction --stack-name {{.STACK}} --region {{.REGION}} --tail

  logs:events:
    desc: Tail the events delivered to the bus (via the catch-all rule)
    cmds:
      - aws logs tail /aws/events/{{.BUS_NAME}} --region {{.REGION}} --follow --format short

  logs:archiver:
    desc: Tail the archiver Lambda logs (one line per batch written)
    cmds:
      - sam logs -n ArchiverFunction --stack-name {{.STACK}} --region {{.REGION}} --tail

  errors:
    desc: Dead-letter queue depth - how many messages the archiver rejected (should be 0)
    vars:
      DLQ:
        sh: task _output KEY=DeadLetterQueueUrl ENDPOINT_ARGS=""
    cmds:
      - |
        N=$(aws sqs get-queue-attributes --queue-url "{{.DLQ}}" --region {{.REGION}} \
              --attribute-names ApproximateNumberOfMessages \
              --query Attributes.ApproximateNumberOfMessages --output text)
        if [ "$N" = "0" ]; then echo "no delivery errors"; else echo "$N message(s) in the dead-letter queue: {{.DLQ}}"; exit 1; fi

  duckdb:
    desc: Open the DuckDB prompt over the deployed archive, views loaded
    vars:
      BUCKET:
        sh: task bucket
    cmds:
      - task: _duckdb
        vars: { SECRET_SQL: "{{.AWS_SECRET_SQL}}", ARCHIVE: "s3://{{.BUCKET}}/events/**/*.jsonl.gz" }

  query:
    desc: Run a SQL file over the deployed archive (QUERY_FILE=queries/examples.sql)
    vars:
      BUCKET:
        sh: task bucket
    cmds:
      - task: _query
        vars: { SECRET_SQL: "{{.AWS_SECRET_SQL}}", ARCHIVE: "s3://{{.BUCKET}}/events/**/*.jsonl.gz" }

  invoke:webhook:
    desc: Invoke the webhook in a local container with events/post.json (needs env.json)
    cmds:
      - sam local invoke WebhookFunction -e events/post.json --env-vars env.json

  invoke:archiver:
    desc: Invoke the archiver in a local container with events/sqs.json (needs env.json, writes to real S3)
    cmds:
      - sam local invoke ArchiverFunction -e events/sqs.json --env-vars env.json

  empty-bucket:
    desc: Empty the lake bucket (CloudFormation cannot delete a bucket with objects)
    vars:
      BUCKET:
        sh: task bucket
    cmds:
      - aws s3 rm "s3://{{.BUCKET}}/" --recursive --region {{.REGION}}

  delete:
    desc: Delete the AWS stack (run empty-bucket first)
    cmds:
      - sam delete --stack-name {{.STACK}} --region {{.REGION}} --no-prompts

  # ------------------------------------------------------------------ LocalStack
  # The whole pipeline on your machine: no AWS account, no WEBHOOK_SECRET. LocalStack
  # needs an auth token even on its free tier: export LOCALSTACK_AUTH_TOKEN.
  local:up:
    desc: Start LocalStack in Docker and wait until it is healthy (needs LOCALSTACK_AUTH_TOKEN)
    preconditions:
      - sh: test -n "$LOCALSTACK_AUTH_TOKEN"
        msg: "LOCALSTACK_AUTH_TOKEN is not set. LocalStack needs one even on its free tier: https://app.localstack.cloud"
    cmds:
      - >-
        docker run -d --name localstack-main -p 4566:4566
        -e LAMBDA_IGNORE_ARCHITECTURE=1 -e LOCALSTACK_AUTH_TOKEN
        -v /var/run/docker.sock:/var/run/docker.sock {{.LOCAL_IMAGE}}
      - |
        echo "waiting for {{.LOCAL_ENDPOINT}} ..."
        for i in $(seq 1 60); do
          curl -sf {{.LOCAL_ENDPOINT}}/_localstack/health >/dev/null && { echo "LocalStack is up"; exit 0; }
          sleep 2
        done
        echo "LocalStack did not come up in time"; docker logs localstack-main | tail -20; exit 1

  local:down:
    desc: Stop and remove LocalStack (deletes everything in it)
    cmds:
      - docker rm -f localstack-main

  local:deploy:
    desc: Build and deploy the stack into LocalStack
    env: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test, AWS_DEFAULT_REGION: "{{.REGION}}" }
    cmds:
      - samlocal build
      - samlocal deploy --config-env local

  local:url:
    desc: Print the LocalStack webhook URL
    env: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test }
    cmds:
      - task: _output
        vars: { KEY: WebhookUrl, ENDPOINT_ARGS: "--endpoint-url {{.LOCAL_ENDPOINT}}" }

  local:generate:
    desc: Post fake events to the LocalStack webhook
    env: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test }
    vars:
      # Function URLs are routed by hostname. Posting to localhost with the URL's host in
      # the Host header works even where *.localhost.localstack.cloud does not resolve.
      HOST:
        sh: task local:url | sed -E 's#^https?://([^/:]+).*#\1#'
    cmds:
      - echo "POSTing to {{.LOCAL_ENDPOINT}}/ as {{.HOST}}"
      - >-
        WEBHOOK_URL={{.LOCAL_ENDPOINT}}/ WEBHOOK_HOST={{.HOST}} WEBHOOK_SECRET={{.LOCAL_SECRET}}
        {{.PY}} generator/generate.py --interval 1 --batch-size 3 --count 10

  local:duckdb:
    desc: Open the DuckDB prompt over the LocalStack archive, views loaded
    cmds:
      - task: _duckdb
        vars: { SECRET_SQL: "{{.LOCAL_SECRET_SQL}}", ARCHIVE: "{{.LOCAL_ARCHIVE}}" }

  local:query:
    desc: Run a SQL file over the LocalStack archive (QUERY_FILE=queries/examples.sql)
    cmds:
      - task: _query
        vars: { SECRET_SQL: "{{.LOCAL_SECRET_SQL}}", ARCHIVE: "{{.LOCAL_ARCHIVE}}" }

  local:verify:
    desc: Assert the LocalStack archive holds EXPECT events (default 30)
    cmds:
      - task: _verify
        vars: { SECRET_SQL: "{{.LOCAL_SECRET_SQL}}", ARCHIVE: "{{.LOCAL_ARCHIVE}}" }

  local:e2e:
    desc: The whole pipeline in LocalStack - up, deploy, generate, verify; what CI runs
    cmds:
      - task: local:up
      - defer: { task: local:down }
      - task: local:deploy
      - task: local:generate
      - echo "waiting 45s for the archiver's batching window" && sleep 45
      - task: local:verify

  # ------------------------------------------------------------------ internal
  _output:
    internal: true
    requires: { vars: [KEY] }
    cmds:
      - >-
        aws {{.ENDPOINT_ARGS}} cloudformation describe-stacks --stack-name {{.STACK}} --region {{.REGION}}
        --query "Stacks[0].Outputs[?OutputKey=='{{.KEY}}'].OutputValue" --output text

  _duckdb:
    internal: true
    requires: { vars: [SECRET_SQL, ARCHIVE] }
    cmds:
      - echo "Views - events, orders, order_items, payments (queries/views.sql). Leave with .quit"
      - echo "Try - SELECT event_type, count(*) FROM events GROUP BY 1;"
      - >-
        duckdb {{.DUCKDB_FLAGS}}
        -cmd "{{.DUCKDB_BOOT}} {{.SECRET_SQL}} SET VARIABLE archive = '{{.ARCHIVE}}';"
        -cmd ".read queries/views.sql"

  _query:
    internal: true
    requires: { vars: [SECRET_SQL, ARCHIVE] }
    cmds:
      - >-
        duckdb {{.DUCKDB_FLAGS}} -box
        -cmd "{{.DUCKDB_BOOT}} {{.SECRET_SQL}} SET VARIABLE archive = '{{.ARCHIVE}}';"
        -cmd ".read queries/views.sql"
        -c ".read {{.QUERY_FILE}}"

  _verify:
    internal: true
    requires: { vars: [SECRET_SQL, ARCHIVE] }
    cmds:
      - |
        N=$(duckdb -noheader -csv \
              -cmd "{{.DUCKDB_BOOT}} {{.SECRET_SQL}} SET VARIABLE archive = '{{.ARCHIVE}}';" \
              -cmd ".read queries/views.sql" \
              -c "SELECT count(*) FROM events;" | tail -1)
        case "$N" in ''|*[!0-9]*) echo "count query failed (got '$N')"; exit 1;; esac
        echo "events archived: $N (expected {{.EXPECT}})"
        test "$N" = "{{.EXPECT}}"
