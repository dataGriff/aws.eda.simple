# Archiver as a Bento stream: one SQS batch of EventBridge envelopes in, one gzipped
# JSON Lines object on S3 out, plus the partial-batch response SQS expects.
#
# Runs inside the Bento Lambda distribution (the `bootstrap` binary, provided.al2023).
# There is no `input` section: the Lambda event is the message. The response returned to
# Lambda is whatever reaches `sync_response`.
#
# The envelope is archived exactly as delivered - nothing added, renamed or flattened. The
# archive is the bus, byte for byte; DuckDB does the interpreting at query time.
#
# Delivery is at-least-once: if the S3 write keeps failing the invocation times out and
# SQS redelivers the whole batch, so an event can appear in two files. The `events` view
# in queries/views.sql dedupes on the envelope id.

logger:
  level: ${LOG_LEVEL:INFO}
  format: json
  add_timestamp: false

pipeline:
  processors:
    # Split the batch into archive lines and the ids of messages that cannot be archived.
    # A body that is a JSON object is archived as the bytes SQS delivered (re-serialised
    # only if it spans lines, which would break JSON Lines). Anything else is reported back
    # so SQS retries just that message.
    - label: parse_batch
      mapping: |
        let records = this.Records.or([])
        let parsed = $records.map_each(r -> {
          "id": r.messageId,
          "raw": r.body.or("").string().trim(),
          "envelope": r.body.parse_json().catch(null),
        })
        let good = $parsed.filter(p -> p.envelope.type() == "object")
        let now = now().ts_tz("UTC")

        meta received = $records.length()
        meta archived = $good.length()
        meta failed = $parsed.filter(p -> p.envelope.type() != "object").map_each(p -> p.id)

        # events/dt=2026-09-27/2026-09-27T20-51-46Z-<uuid>.jsonl.gz
        # dt= is a Hive-style partition DuckDB prunes on; the timestamp in the name is what
        # the lag query reads. Colons are avoided because they are awkward in S3 keys and URLs.
        # Lambda's request id is not visible to Bento, so a uuid keeps the name unique.
        meta key = env("ARCHIVE_PREFIX").or("events/") +
          "dt=" + $now.ts_format("2006-01-02") + "/" +
          $now.ts_format("2006-01-02T15-04-05") + "Z-" + uuid_v4() + ".jsonl.gz"

        # Newline-delimited JSON, one envelope per line, trailing newline.
        root = if $good.length() > 0 {
          $good.map_each(p -> if p.raw.contains("\n") { p.envelope.string() } else { p.raw }).join("\n") + "\n"
        } else {
          ""
        }

    - compress:
        algorithm: gzip

    - log:
        level: INFO
        message: archive
        fields_mapping: |
          root.received = @received
          root.archived = @archived
          root.rejected = @failed.length()
          root.key = if @archived > 0 { @key } else { null }

output:
  switch:
    cases:
      # Nothing archivable: no S3 object, just tell SQS which messages to retry.
      - check: '@archived == 0'
        output:
          sync_response: {}
          processors:
            - label: batch_item_failures_empty
              mapping: 'root.batchItemFailures = @failed.map_each(id -> {"itemIdentifier": id})'

      # Write the file first, then answer. A failed write is retried until the Lambda
      # timeout; the batch is then redelivered by SQS.
      - output:
          broker:
            pattern: fan_out_sequential
            outputs:
              - aws_s3:
                  bucket: ${ARCHIVE_BUCKET}
                  path: '${! metadata("key") }'
                  # No content_encoding on purpose: DuckDB keys on the .gz extension, and a
                  # transport-level encoding invites double decompression in some clients.
                  content_type: application/x-ndjson
                  max_in_flight: 1
              - sync_response: {}
                processors:
                  - label: batch_item_failures
                    mapping: 'root.batchItemFailures = @failed.map_each(id -> {"itemIdentifier": id})'
