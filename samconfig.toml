# SAM CLI configuration. The WebhookSecret parameter is deliberately NOT stored here;
# `task deploy` passes it from the WEBHOOK_SECRET environment variable, along with
# ArchiverImage, the ECR URI `task image:push` produced.
# Note: --parameter-overrides on the CLI replaces this whole list, which is why the
# Taskfile passes BusName and EventSource as well.
version = 0.1

[default.global.parameters]
stack_name = "aws-eda-simple"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
fail_on_empty_changeset = false
parameter_overrides = "BusName=simple-eda-bus EventSource=com.example.shop"

[default.sync.parameters]
watch = true

[default.local_invoke.parameters]
env_vars = "env.json"

# `samlocal deploy --config-env local` targets Floci (task local:deploy). The secret here is
# deliberately not secret: it only ever guards a webhook on localhost. ArchiverDeployment=none
# leaves ECS out: the archiver container is started by `task local:archiver:up` instead.
[local.global.parameters]
stack_name = "aws-eda-simple"

[local.deploy.parameters]
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
fail_on_empty_changeset = false
parameter_overrides = "WebhookSecret=local-dev-secret-0123456789 BusName=simple-eda-bus EventSource=com.example.shop ArchiverDeployment=none"
