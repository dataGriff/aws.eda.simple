AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  aws.eda.simple - a webhook Lambda (Function URL) that publishes inbound JSON events
  to a custom Amazon EventBridge bus. A catch-all rule fans every event out to a
  CloudWatch log group (so the pipeline can be observed end-to-end) and to an SQS queue
  drained by a Bento stream running as a container on ECS Fargate that archives each
  batch to S3 as gzipped JSON Lines.

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret callers must send in the X-Webhook-Secret header.
  BusName:
    Type: String
    Default: simple-eda-bus
    Description: Name of the custom EventBridge bus.
  EventSource:
    Type: String
    Default: com.example.shop
    Description: Value used for the EventBridge "source" field on every published event.
  LogRetentionDays:
    Type: Number
    Default: 7
    Description: Retention for the Lambda, archiver and event log groups.
  ArchiverDeployment:
    Type: String
    Default: fargate
    AllowedValues: [fargate, none]
    Description: >-
      fargate runs the archiver as an ECS service on Fargate (needs ArchiverImage). none
      creates the queue and the bucket only, for running the same container yourself - which
      is what the Floci run does with plain docker.
  ArchiverImage:
    Type: String
    Default: ""
    Description: >-
      The archiver's container image (ECR URI with a tag). Built from src/archiver/Dockerfile
      and pushed by `task image:push`; `task deploy` passes it. Ignored when ArchiverDeployment
      is none.
  ArchiverDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: >-
      Archiver tasks to run. 0 pauses the archiver (events wait on the queue, up to 14 days);
      more than 1 is safe (at-least-once, deduplicated at read time) but pointless at this volume.

Conditions:
  RunArchiverOnFargate: !Equals [!Ref ArchiverDeployment, fargate]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256

Resources:
  # ------------------------------------------------------------------ EventBridge
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref BusName

  # ------------------------------------------------------------------ Webhook Lambda
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Accepts JSON events over HTTPS and publishes them to the EventBridge bus.
      CodeUri: src/webhook/
      Handler: app.lambda_handler
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref EventBus
          EVENT_SOURCE: !Ref EventSource
          WEBHOOK_SECRET: !Ref WebhookSecret
          MAX_EVENTS_PER_REQUEST: "100"
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Sid: PutEventsToBus
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn

  # Public HTTPS endpoint; the shared secret header is checked inside the function.
  # Declared explicitly rather than via SAM's FunctionUrlConfig, which expands to exactly
  # these two resources on AWS but is not expanded by Floci's SAM transform.
  WebhookFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt WebhookFunction.Arn
      AuthType: NONE

  WebhookFunctionUrlPublicAccess:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref WebhookFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

  WebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WebhookFunction}
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------ Observability
  # Every event on the bus is copied to this log group so you can watch it flow.
  EventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/events/${BusName}
      RetentionInDays: !Ref LogRetentionDays

  # Required: EventBridge cannot write to a log group without a resource policy.
  # Without this the rule deploys fine but delivers nothing (only FailedInvocations rises).
  EventsLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-eventbridge-to-logs
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowEventBridgeToWriteLogs",
              "Effect": "Allow",
              "Principal": {
                "Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"]
              },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "${EventsLogGroup.Arn}"
            }
          ]
        }

  # One rule, two targets: the log group for watching, the archive queue for keeping.
  # Targets are independent, so a permission problem on one cannot stop the other.
  CatchAllRule:
    Type: AWS::Events::Rule
    DependsOn: [EventsLogGroupPolicy, ArchiveQueuePolicy]
    Properties:
      Name: !Sub ${BusName}-catch-all
      Description: Fan every event published by the webhook out to CloudWatch Logs and the archive queue.
      EventBusName: !Ref EventBus
      State: ENABLED
      # An empty pattern {} is rejected; matching on our source is effectively catch-all.
      EventPattern:
        source:
          - !Ref EventSource
      Targets:
        - Id: events-log-group
          Arn: !GetAtt EventsLogGroup.Arn
        # SQS targets are authorised by a queue policy (ArchiveQueuePolicy), not a role.
        - Id: events-archive-queue
          Arn: !GetAtt ArchiveQueue.Arn

  # ------------------------------------------------------------------ Archive
  # events/ holds the archive, one gzipped JSON Lines file per batch.
  LakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-lake-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # The queue is the buffer: if the archiver is broken or paused, events wait here for up
  # to 14 days.
  ArchiveQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-archive
      # How long a message a dead archiver had in flight stays hidden before another one
      # gets it. A live archiver extends this for as long as a message waits in a batch
      # (aws_sqs input, update_visibility), so it need not cover the batch period.
      VisibilityTimeout: 90
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ArchiveDeadLetterQueue.Arn
        maxReceiveCount: 3

  ArchiveDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-archive-dlq
      MessageRetentionPeriod: 1209600

  # Required: EventBridge cannot send to a queue without a queue policy - the same lesson as
  # EventsLogGroupPolicy. Without this the target deploys but silently delivers nothing.
  # The rule ARN is built rather than referenced so the rule can DependsOn this policy.
  ArchiveQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ArchiveQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeToSendMessages
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ArchiveQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${BusName}/${BusName}-catch-all

  # ------------------------------------------------------------------ Archiver (Bento on Fargate)
  # The archiver is a Bento stream (src/archiver/archiver.yaml) in a container
  # (src/archiver/Dockerfile) run as one long-lived ECS Fargate task: it long-polls the
  # queue, batches by count and period, writes one gzipped JSON Lines object per batch, and
  # deletes a message only once the object holding it is on S3. Everything from here to the
  # end of Resources exists only when ArchiverDeployment is fargate.
  #
  # Fargate needs a network. This is the smallest one that works with no NAT gateway: two
  # public subnets, an internet gateway, and a public IP on the task, which it uses to reach
  # ECR, CloudWatch Logs and SQS. Nothing listens on it: the security group has no ingress.
  # S3 traffic stays off the internet through the (free) gateway endpoint.
  ArchiverVpc:
    Type: AWS::EC2::VPC
    Condition: RunArchiverOnFargate
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-archiver

  ArchiverInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: RunArchiverOnFargate

  ArchiverVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: RunArchiverOnFargate
    Properties:
      VpcId: !Ref ArchiverVpc
      InternetGatewayId: !Ref ArchiverInternetGateway

  # Two subnets in two zones: ECS places the task in either, and a zone outage moves it.
  ArchiverSubnetA:
    Type: AWS::EC2::Subnet
    Condition: RunArchiverOnFargate
    Properties:
      VpcId: !Ref ArchiverVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  ArchiverSubnetB:
    Type: AWS::EC2::Subnet
    Condition: RunArchiverOnFargate
    Properties:
      VpcId: !Ref ArchiverVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  ArchiverRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: RunArchiverOnFargate
    Properties:
      VpcId: !Ref ArchiverVpc

  ArchiverDefaultRoute:
    Type: AWS::EC2::Route
    Condition: RunArchiverOnFargate
    DependsOn: ArchiverVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref ArchiverRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ArchiverInternetGateway

  ArchiverSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: RunArchiverOnFargate
    Properties:
      SubnetId: !Ref ArchiverSubnetA
      RouteTableId: !Ref ArchiverRouteTable

  ArchiverSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: RunArchiverOnFargate
    Properties:
      SubnetId: !Ref ArchiverSubnetB
      RouteTableId: !Ref ArchiverRouteTable

  ArchiverS3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: RunArchiverOnFargate
    Properties:
      VpcId: !Ref ArchiverVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref ArchiverRouteTable

  ArchiverSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: RunArchiverOnFargate
    Properties:
      GroupDescription: Archiver task - outbound only
      VpcId: !Ref ArchiverVpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: ECR, CloudWatch Logs and SQS over HTTPS

  ArchiverCluster:
    Type: AWS::ECS::Cluster
    Condition: RunArchiverOnFargate
    Properties:
      ClusterName: !Sub ${AWS::StackName}-archiver

  ArchiverLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: RunArchiverOnFargate
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}-archiver
      RetentionInDays: !Ref LogRetentionDays

  # Two roles, as ECS wants them: the execution role is what ECS itself uses to pull the
  # image and ship logs; the task role is what Bento uses, and it can do exactly what the
  # archiver Lambda's role could - receive and delete on this queue, put under events/ in
  # this bucket - and nothing else.
  ArchiverExecutionRole:
    Type: AWS::IAM::Role
    Condition: RunArchiverOnFargate
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ArchiverTaskRole:
    Type: AWS::IAM::Role
    Condition: RunArchiverOnFargate
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: archiver
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ConsumeArchiveQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ArchiveQueue.Arn
              - Sid: WriteArchive
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${LakeBucket.Arn}/events/*

  ArchiverTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: RunArchiverOnFargate
    Properties:
      Family: !Sub ${AWS::StackName}-archiver
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # The smallest Fargate size. Bento idles at a few tens of MB; a 100-event batch is
      # a few hundred KB of work.
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: ARM64
      ExecutionRoleArn: !GetAtt ArchiverExecutionRole.Arn
      TaskRoleArn: !GetAtt ArchiverTaskRole.Arn
      ContainerDefinitions:
        - Name: archiver
          Image: !Ref ArchiverImage
          Essential: true
          # The whole runtime configuration: src/archiver/archiver.yaml reads these and
          # nothing else. Region and credentials come from the task role and ECS itself.
          Environment:
            - Name: ARCHIVE_QUEUE_URL
              Value: !Ref ArchiveQueue
            - Name: ARCHIVE_BUCKET
              Value: !Ref LakeBucket
            - Name: ARCHIVE_PREFIX
              Value: events/
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # One file per 100 events or 30 seconds, whichever comes first - the same shape
            # as the Lambda version. Bigger, fewer files are one edit away (bento.md).
            - Name: BATCH_COUNT
              Value: "100"
            - Name: BATCH_PERIOD
              Value: 30s
            - Name: LOG_LEVEL
              Value: INFO
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ArchiverLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: archiver
          # Bento answers /ready once its input and output are connected. wget is busybox's,
          # present in the official image.
          HealthCheck:
            Command: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4195/ready || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 15
          # On SIGTERM Bento stops reading, finishes the batch in hand and acks it
          # (shutdown_timeout 20s by default); give it that long before the SIGKILL.
          StopTimeout: 30

  ArchiverService:
    Type: AWS::ECS::Service
    Condition: RunArchiverOnFargate
    # Tasks pull the image over the internet gateway, so the route must exist first.
    DependsOn: [ArchiverDefaultRoute, ArchiverS3Endpoint]
    Properties:
      ServiceName: archiver
      Cluster: !Ref ArchiverCluster
      LaunchType: FARGATE
      TaskDefinition: !Ref ArchiverTaskDefinition
      DesiredCount: !Ref ArchiverDesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref ArchiverSubnetA
            - !Ref ArchiverSubnetB
          SecurityGroups:
            - !Ref ArchiverSecurityGroup
      # A new image or config rolls out as a new task next to the old one; two consumers on
      # the queue for a minute is harmless (at-least-once, dedupe at read time). A task that
      # keeps failing its health check rolls the deployment back instead of flapping.
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PropagateTags: SERVICE

Outputs:
  WebhookUrl:
    Description: POST JSON events here with the X-Webhook-Secret header.
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref WebhookFunction
  EventBusName:
    Value: !Ref EventBus
  EventBusArn:
    Value: !GetAtt EventBus.Arn
  LogGroupName:
    Description: Log group receiving a copy of every event on the bus.
    Value: !Ref EventsLogGroup
  LakeBucketName:
    Description: Bucket holding the archive under events/.
    Value: !Ref LakeBucket
  ArchiveLocation:
    Description: S3 URI of the archive - DuckDB reads events/**/*.jsonl.gz under here.
    Value: !Sub s3://${LakeBucket}/events/
  ArchiveQueueUrl:
    Value: !Ref ArchiveQueue
  DeadLetterQueueUrl:
    Description: Messages the archiver rejected three times. Should stay empty.
    Value: !Ref ArchiveDeadLetterQueue
  ArchiverCluster:
    Condition: RunArchiverOnFargate
    Description: ECS cluster running the archiver service.
    Value: !Ref ArchiverCluster
  ArchiverService:
    Condition: RunArchiverOnFargate
    Description: ECS service name of the archiver (one Fargate task).
    Value: !GetAtt ArchiverService.Name
  ArchiverLogGroup:
    Condition: RunArchiverOnFargate
    Description: Log group of the archiver container - one line per batch written.
    Value: !Ref ArchiverLogGroup
