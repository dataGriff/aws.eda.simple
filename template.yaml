AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  aws.eda.simple - a webhook Lambda (Function URL) that publishes inbound JSON events
  to a custom Amazon EventBridge bus. A catch-all rule fans every event out to a
  CloudWatch log group (so the pipeline can be observed end-to-end) and to an Amazon
  Data Firehose stream that lands it in an Apache Iceberg table on S3.

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret callers must send in the X-Webhook-Secret header.
  BusName:
    Type: String
    Default: simple-eda-bus
    Description: Name of the custom EventBridge bus.
  EventSource:
    Type: String
    Default: com.example.shop
    Description: Value used for the EventBridge "source" field on every published event.
  LogRetentionDays:
    Type: Number
    Default: 7
    Description: Retention for the Lambda, event and Firehose log groups.
  GlueDatabaseName:
    Type: String
    Default: shop_events
    AllowedPattern: "[a-z0-9_]+"
    Description: >
      Glue database holding the Iceberg table. Underscores only - the Iceberg library
      Firehose uses rejects hyphens in database and table names.
  GlueTableName:
    Type: String
    Default: events
    AllowedPattern: "[a-z0-9_]+"
    Description: Name of the Iceberg table receiving every event on the bus.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256

Resources:
  # ------------------------------------------------------------------ EventBridge
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref BusName

  # ------------------------------------------------------------------ Webhook Lambda
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Accepts JSON events over HTTPS and publishes them to the EventBridge bus.
      CodeUri: src/webhook/
      Handler: app.lambda_handler
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref EventBus
          EVENT_SOURCE: !Ref EventSource
          WEBHOOK_SECRET: !Ref WebhookSecret
          MAX_EVENTS_PER_REQUEST: "100"
          LOG_LEVEL: INFO
      # Public HTTPS endpoint. SAM also creates the lambda:InvokeFunctionUrl permission.
      # The shared secret header is checked inside the function.
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Sid: PutEventsToBus
              Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn

  WebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${WebhookFunction}
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------ Observability
  # Every event on the bus is copied to this log group so you can watch it flow.
  EventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/events/${BusName}
      RetentionInDays: !Ref LogRetentionDays

  # Required: EventBridge cannot write to a log group without a resource policy.
  # Without this the rule deploys fine but delivers nothing (only FailedInvocations rises).
  EventsLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-eventbridge-to-logs
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowEventBridgeToWriteLogs",
              "Effect": "Allow",
              "Principal": {
                "Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"]
              },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "${EventsLogGroup.Arn}"
            }
          ]
        }

  # One rule, two targets: the log group for watching, Firehose for keeping.
  # Targets are independent, so a permission problem on one cannot stop the other.
  CatchAllRule:
    Type: AWS::Events::Rule
    DependsOn: EventsLogGroupPolicy
    Properties:
      Name: !Sub ${BusName}-catch-all
      Description: Fan every event published by the webhook out to CloudWatch Logs and Firehose.
      EventBusName: !Ref EventBus
      State: ENABLED
      # An empty pattern {} is rejected; matching on our source is effectively catch-all.
      EventPattern:
        source:
          - !Ref EventSource
      Targets:
        - Id: events-log-group
          Arn: !GetAtt EventsLogGroup.Arn
        # Same lesson as the log group above, via IAM rather than a resource policy:
        # without this role the target deploys but silently delivers nothing.
        - Id: events-firehose
          Arn: !GetAtt EventsFirehose.Arn
          RoleArn: !GetAtt EventBridgeToFirehoseRole.Arn

  EventBridgeToFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: put-records-to-firehose
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt EventsFirehose.Arn

  # ------------------------------------------------------------------ Lake storage
  # events/ holds the Iceberg table, errors/ holds records Firehose could not deliver.
  LakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-lake-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  EventsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: Events captured from the EventBridge bus.

  # Iceberg table created by Glue itself (MetadataOperation: CREATE writes the Iceberg
  # metadata under the location). Firehose only delivers to genuine Iceberg tables.
  # Unpartitioned: CloudFormation cannot express an Iceberg partition spec here, only
  # Hive-style PartitionKeys, which is a different thing. Add one later with
  # ALTER TABLE ... ADD PARTITION FIELD from any Iceberg engine.
  EventsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref EventsDatabase
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: CREATE
          Version: "2"
      TableInput:
        Name: !Ref GlueTableName
        Description: One row per event on the bus; detail holds the payload as JSON.
        TableType: EXTERNAL_TABLE
        # No table_type/metadata_location here: Glue sets both itself when
        # MetadataOperation is CREATE, and rejects them as reserved parameters.
        StorageDescriptor:
          Location: !Sub s3://${LakeBucket}/events/
          Columns:
            - Name: event_id
              Type: string
              Comment: detail.id - the business event id
            - Name: event_type
              Type: string
              Comment: EventBridge detail-type
            - Name: source
              Type: string
            - Name: event_time
              Type: timestamp
            - Name: ingest_time
              Type: timestamp
              Comment: set by the transform Lambda; event_time minus this is pipeline lag
            - Name: detail
              Type: string
              Comment: the whole inbound event as JSON, so new payload fields never break ingestion

  # ------------------------------------------------------------------ Firehose
  # Firehose maps only the first level of a record's JSON to columns, and the bus
  # envelope nests the event under "detail". This function flattens it.
  FirehoseTransformFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Reshapes EventBridge envelopes into rows matching the Iceberg table.
      CodeUri: src/firehose_transform/
      Handler: app.lambda_handler
      # Firehose expects a transform to answer well within its own 5 minute budget.
      Timeout: 60
      Environment:
        Variables:
          LOG_LEVEL: INFO

  FirehoseTransformFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FirehoseTransformFunction}
      RetentionInDays: !Ref LogRetentionDays

  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/kinesisfirehose/${AWS::StackName}-events-to-iceberg
      RetentionInDays: !Ref LogRetentionDays

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: IcebergDelivery

  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deliver-to-iceberg-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Firehose commits Iceberg snapshots by updating the table in the catalog.
              - Sid: IcebergCatalogCommits
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                  - glue:UpdateTable
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/${GlueTableName}
              - Sid: WriteTableDataAndErrors
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt LakeBucket.Arn
                  - !Sub ${LakeBucket.Arn}/*
              - Sid: InvokeTransform
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !GetAtt FirehoseTransformFunction.Arn
                  - !Sub ${FirehoseTransformFunction.Arn}:*
              - Sid: WriteDeliveryLogs
                Effect: Allow
                Action: logs:PutLogEvents
                Resource: !GetAtt FirehoseLogGroup.Arn

  EventsFirehose:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub ${AWS::StackName}-events-to-iceberg
      DeliveryStreamType: DirectPut
      IcebergDestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        CatalogConfiguration:
          CatalogArn: !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
        # Inserts only, no updates or deletes, which lets Firehose scale throughput.
        AppendOnly: true
        DestinationTableConfigurationList:
          - DestinationDatabaseName: !Ref GlueDatabaseName
            DestinationTableName: !Ref GlueTableName
        # One Iceberg commit per flush: 60s keeps the demo responsive at the cost of
        # small Parquet files. See "Compaction" in the README.
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 64
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt FirehoseTransformFunction.Arn
        RetryOptions:
          DurationInSeconds: 300
        # Required even for an Iceberg destination: this is where records Firehose
        # could not deliver land, with the reason attached.
        S3Configuration:
          BucketARN: !GetAtt LakeBucket.Arn
          RoleARN: !GetAtt FirehoseRole.Arn
          ErrorOutputPrefix: 'errors/!{firehose:error-output-type}/'
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream

Outputs:
  WebhookUrl:
    Description: POST JSON events here with the X-Webhook-Secret header.
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref WebhookFunction
  EventBusName:
    Value: !Ref EventBus
  EventBusArn:
    Value: !GetAtt EventBus.Arn
  LogGroupName:
    Description: Log group receiving a copy of every event on the bus.
    Value: !Ref EventsLogGroup
  LakeBucketName:
    Description: Bucket holding the Iceberg table (events/) and delivery failures (errors/).
    Value: !Ref LakeBucket
  TableLocation:
    Description: S3 URI of the Iceberg table - point DuckDB's iceberg_scan at this.
    Value: !Sub s3://${LakeBucket}/events/
  GlueDatabaseName:
    Value: !Ref GlueDatabaseName
  GlueTableName:
    Value: !Ref GlueTableName
  FirehoseStreamName:
    Value: !Ref EventsFirehose
